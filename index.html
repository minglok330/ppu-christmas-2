<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Merry Christmas</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130f}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
(()=>{const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR,angle=0;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const TAU=Math.PI*2,TREE_HEIGHT=12,CAM_DIST=20,CAM_HEIGHT=5.2,PITCH=-.18;const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const tree=[],ground=[],stars=[],heart=[];
// dense spiral strand + fluffy fill, adapted from the source Python project
for(let i=0;i<35000;i++){let u=Math.random(),h=u**1.6,y=TREE_HEIGHT*h+.2,base=(1-h)**1.1*3.2,w=Math.max(0,Math.sin((h*5.8+.15)*TAU)),r0=base*(1+.65*w),a=u*9*TAU+rnd(-.22,.22),r=r0*rnd(.85,1.08),x=Math.cos(a)*r,z=Math.sin(a)*r,boost=Math.max(.15,1-Math.abs(h-.55)*1.5),g=Math.min(255,155+90*boost+rnd(-15,20)),b=Math.min(255,185+70*boost+rnd(-15,35));if(Math.random()<.08){g=rnd(220,255);b=rnd(230,255)}tree.push({x,y,z,c:[255,g,b]})}
for(let i=0;i<15000;i++){let h=Math.random()**1.9,y=TREE_HEIGHT*h+.2+rnd(-.08,.08),base=(1-h)**1.1*4.3,w=Math.max(0,Math.sin((h*5.8+.15)*TAU)),r=base*(1+.65*w)*Math.sqrt(Math.random()),a=Math.random()*TAU,x=Math.cos(a)*r+rnd(-.08,.08),z=Math.sin(a)*r+rnd(-.08,.08);tree.push({x,y,z,c:[rnd(12,38),rnd(75,155),rnd(22,55)]})}
const rings=[4.6,6,7.4,8.8,10.2,11.4];for(let i=0;i<4000;i++){let r=rnd(-.3,.3)+pick(rings),a=Math.random()*TAU,c=rnd(190,255);ground.push({x:Math.cos(a)*r,y:-.25,z:Math.sin(a)*r,c:[c,c,255]})}
for(let i=0;i<1200;i++){stars.push({x:rnd(-18,18),y:rnd(3,18),z:rnd(-18,18),c:[rnd(215,255),rnd(215,255),255]})}
// Star topper is drawn as a glowing gold five-point star in the render loop
const flakes=Array.from({length:180},()=>({x:rnd(0,W),y:rnd(-H,H),r:rnd(.65,2.1),v:rnd(22,58),drift:rnd(-12,12),phase:rnd(0,TAU),alpha:rnd(.25,.8)}));function project(p,a){let ca=Math.cos(a),sa=Math.sin(a),xz=p.x*ca-p.z*sa,zz=p.x*sa+p.z*ca,cp=Math.cos(PITCH),sp=Math.sin(PITCH),yp=p.y*cp-zz*sp,zp=p.y*sp+zz*cp+CAM_DIST;yp-=CAM_HEIGHT;if(zp<=.1)return null;let f=(H*.63)/zp;return [W/2+xz*f,H/2-yp*f,zp]}
let last=0;function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;let bg=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.75);bg.addColorStop(0,'#14251d');bg.addColorStop(.62,'#091610');bg.addColorStop(1,'#030907');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);let draw=[];for(const p of tree.concat(ground,stars,heart)){let q=project(p,angle);if(q){let sz=Math.max(.65,3.6-q[2]*.13)*(W<700?.7:1);draw.push([q[2],q[0],q[1],sz,p.c])}}draw.sort((a,b)=>b[0]-a[0]);for(const d of draw){let [depth,x,y,s,c]=d;if(x<0||x>W||y<0||y>H)continue;ctx.fillStyle=`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;ctx.shadowBlur=s>2?5:0;ctx.shadowColor='#d8f4ff';ctx.beginPath();ctx.arc(x,y,s,0,TAU);ctx.fill()}ctx.shadowBlur=0;
// softly glowing gold five-point star topper
const tip=project({x:0,y:TREE_HEIGHT+.72,z:0},angle);
if(tip){const sx=tip[0],sy=tip[1],size=Math.max(14,Math.min(25,W*.045));ctx.save();ctx.translate(sx,sy);ctx.shadowColor='#FFD66B';ctx.shadowBlur=22;ctx.fillStyle='#FFE29A';ctx.beginPath();for(let i=0;i<10;i++){let r=i%2===0?size:size*.43,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.shadowBlur=8;ctx.strokeStyle='#FFF3C5';ctx.lineWidth=1;ctx.stroke();ctx.restore();}
// Refined typography: restrained champagne gold + ivory, with a fine divider
const titleY=H*.835;ctx.textAlign='center';ctx.shadowBlur=0;
ctx.fillStyle='#D8BC83';ctx.font=`italic ${Math.max(27,Math.min(43,W*.068))}px Georgia,'Times New Roman',serif`;ctx.fillText('Merry Christmas',W/2,titleY);
const lineW=Math.min(150,W*.32);ctx.strokeStyle='rgba(216,188,131,.55)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(W/2-lineW/2,titleY+17);ctx.lineTo(W/2+lineW/2,titleY+17);ctx.stroke();
ctx.fillStyle='#F2E9D8';ctx.font=`${Math.max(17,Math.min(25,W*.038))}px 'Noto Serif SC','Songti SC',serif`;ctx.fillText('噗噗圣诞节快乐',W/2,titleY+47);

for(const f of flakes){f.phase+=dt*.65;f.y+=f.v*dt;f.x+=(f.drift+Math.sin(f.phase)*9)*dt;if(f.y>H+8){f.y=-8;f.x=rnd(0,W)}if(f.x>W+8)f.x=-8;if(f.x<-8)f.x=W+8;ctx.globalAlpha=f.alpha*(.72+.28*Math.sin(f.phase*1.7));ctx.fillStyle='#FFF8E8';ctx.shadowBlur=f.r>1.5?3:0;ctx.shadowColor='#FFF3D0';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1}angle+=.0035;requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();</script></body></html>
